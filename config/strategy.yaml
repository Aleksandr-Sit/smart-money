# ЕДИНЫЙ ИСТОЧНИК ПРАВДЫ — параметры торговой стратегии (Контур 2).
# Раньше были разбросаны по 4 файлам (signal_engine/positions/monitor/delivery) — аудит-4.
# version пишется в КАЖДЫЙ сигнал и выход → всегда известно, какой конфиг породил данные.
# ПРАВИЛО: меняешь параметр → поднимаешь version → старые данные не смешиваются с новыми.

version: "2026-08-12.3"   # наблюдение за несошедшимися покупками трёх лучших акторов

# --- ВХОД: движок конфлюенса -------------------------------------------------
signal:
  CONFLUENCE_N: 2            # разных акторов для сигнала (weak)
  # НЕ ВЛИЯЕТ НА ВХОД при entry.RULE="all" (с 07.08): уровень strong/weak
  # вычисляется и пишется в журнал, но tradable() его не смотрит. Влияние вернётся
  # только при откате правила на "strong_or_priority". Аудит 08.08: настройка,
  # которая выглядит работающей, но не работает, опаснее её отсутствия.
  STRONG_CONFLUENCE_N: 3     # порог strong (сейчас только метка в журнале)
  CONFLUENCE_WINDOW_S: 600   # окно схождения, сек
  # УДАЛЕНЫ 10.08: SIGNAL_MAX_MC_USD и SIGNAL_MAX_AGE_S. Гейты по капитализации и
  # возрасту токена выброшены из движка аудитом-6 — они не срабатывали НИ РАЗУ (BuyEvent
  # приходит без token_mc), а замер показал, что включать их вредно: сигналы с MC>100k —
  # лучшая когорта (win 0.57 против 0.42). В конфиге они продолжали лежать и выглядеть
  # действующим ограничением. Потолок капитализации задаёт ключ монитора --max-mc.
  SIGNAL_MIN_USD: 20         # не пыль
  # «тихий конфлюенс» — единственная ось входа, прошедшая 2 независимых OOS
  # (тихие mean +21..28%, громкие −6.5%). Порог провизорный, калибровать на новых данных.
  QUIET_MAX_USD: 250
  # НАБЛЮДЕНИЕ ЗА НЕСОШЕДШИМИСЯ ПОКУПКАМИ (12.08). Замер: 76% токенов, купленных
  # нашими же акторами, никогда не складываются в конфлюенс — 2664 из 11092. Оценить
  # пропущенное было нечем: трекер регистрирует токен только после сигнала.
  # Перечисленные кошельки ведём трекером и БЕЗ конфлюенса, вход при этом НЕ
  # происходит — это сбор данных, чтобы через несколько суток честно посчитать,
  # чего стоил бы вход по одному актору.
  # ОТБОР ИСПРАВЛЕН 12.08 ПОСЛЕ РАЗБОРА ЦЕПИ. Сначала сюда был поставлен CkLT4ADy —
  # он приходит первым в 89% токенов и находит уникальные в 58%. Восстановление его
  # торговли с кошелька (258 транзакций) показало, что следовать за ним НЕЛЬЗЯ:
  #   94 из 95 позиций закрыты полностью, медиана возврата ровно 1.00x
  #   (p25 0.97x, p75 1.04x), прибыльных 48% — подбрасывание монеты;
  #   удержание МЕДИАНА 0.0 минут, максимум 0.0 часа — вход и выход в одном блоке;
  #   итог 159.27 SOL вложено → 168.32 SOL возвращено, +5.7% за 19.5 суток.
  # Это MEV/арбитражный бот с латентным преимуществом, а не «умные деньги»,
  # сидящие до крупной капитализации. Его edge непереносим: к моменту, когда мы
  # видим его покупку, он уже продал.
  # Поэтому наблюдаем за теми, кто ДЕРЖИТ и зарабатывает по нашим же замерам:
  #   vbXpsjNX +$1.40/сделку, первым в 68% · 7b6UxPg3 +$0.82, первым в 69%
  #   Eqm4pdRd +$1.02/сделку, первым в 55%
  TRACK_SOLO_ACTORS:
    - "vbXpsjNXdg57VatGKiYN1ZY4ffwqoumPzztCMnJCxd9"
    - "7b6UxPg3TKwQGN9JeFzRuRs93ushNxfF68KoWE4SwKfm"
    - "Eqm4pdRd3kLSfie5mNHrVQgdaz3zLGVXmCT1qWsaaaJB"
  TRACK_SOLO_S: 900     # 15 минут: нужна ранняя траектория, а не полная жизнь токена

# --- ПРАВИЛО ВХОДА (аудит-7, замерено на 2007 сделках со скользящей валидацией) -----
# Найдено: наши сигналы делятся на ТРИ популяции, и одна из них теряет деньги.
#   strong (3+ актора) без приоритетных: n=695 mean +25.0%  → торгуем
#   weak (2 актора) С приоритетным:      n=150 mean +68.9%  → торгуем (медиана +68%!)
#   weak без приоритетных:               n=1160 mean −4.8%  → УБЫТОК, отбрасываем
# Правило «strong ИЛИ приоритетный» на 3 фолдах вне обучения: +$2045 против +$1545 (1.32x)
# при 42% сделок; отброшенная когорта убыточна во ВСЕХ фолдах.
# Приоритетные акторы — один оператор с двумя группами кошельков (Жаккар 1.00, всегда
# вместе), поэтому их сигнал всегда weak: 2 актора. Это НЕ ошибка разметки, а их подпись.
# ВАЖНО: список требует периодической перепроверки — акторы уходят (26 из 68 уже молчат).
entry:
  # ИЗМЕНЕНО 07.08 на "all" по замеру на 5541 реальной сделке (доходности пересчитаны
  # под отключённые стоп и тейк). A/B:
  #   all                        5541 сделок  win 0.44  мед  −5.4%  +8545$  без-топ3 +8128$
  #   приоритетные ИЛИ 500–3000$ 1469 сделок  win 0.64  мед +28.8%  +6839$
  #   strong_or_priority (было)   890 сделок  win 0.76  мед +51.5%  +5602$
  # Все варианты положительны во всех четырёх отрезках периода. Прежнее правило
  # отвергало 4761 сделку с фактическим итогом +6075$ — это была прибыль худшего
  # качества, а не убыток. Просадка "all" $39 против $0 у узких правил, при банке $400.
  # ЦЕНА: нагрузка растёт с 34 до 213 сделок в сутки (~426 транзакций).
  # ДОГОВОРЁННОСТЬ: пересматривать каждые 72 часа; при ухудшении вернуться к
  # "приоритетные ИЛИ объём 500–3000$" (второй по доходности, вчетверо меньше сделок).
  RULE: "all"                  # "all" = торговать всё | "strong_or_priority"
  # ТРЕБОВАНИЕ НЕЗАВИСИМОГО ПОДТВЕРЖДЕНИЯ (включено 12.08).
  # Один участник держит несколько кошельков и в одиночку закрывает CONFLUENCE_N=2 —
  # подтверждения в таком сигнале нет вовсе. Связки определяет src/lockstep.py
  # (совпадение множеств токенов + совместная покупка в пределах секунды); найдено
  # три группы, дающие 12.3% сигналов.
  # A/B на 10 188 сделках за 30.1 сут, издержки 12%, вход у всех веток одинаковый:
  #   all (было)          10188 сделок  +$4340  без топ-3 +$3847  +$144/сут  4/4 отрезка
  #   независимых>=2       8990 сделок  +$5016  без топ-3 +$4523  +$167/сут  4/4 отрезка
  #   gap 1-20с            2703 сделки  +$2764  без топ-3 +$2401   +$92/сут  4/4 — отклонено
  # Портфельно (банк $400, клип $10, 5 слотов) разорения нет ни в одной ветке,
  # отказов по слотам 10 из 10188 — ёмкость не связывает.
  # 1 = фильтр выключен, поведение как раньше. Нет файла output/lockstep.json —
  # фильтр молчит и пропускает всё: отсутствие данных не должно менять отбор.
  MIN_INDEPENDENT: 2
  # НЕ ВЛИЯЮТ НА ВХОД при RULE="all" — торгуется каждый сигнал независимо от состава.
  # Список НЕ мёртв: по нему работает алерт PRIORITY_SILENCE_H («лучшая когорта под
  # угрозой»), и он понадобится при откате на "strong_or_priority".
  # Замер 07.08: сигналы с этими акторами дают win 0.90 и медиану +69.5% против
  # 0.46/−2.1% у остальных — это лучшая когорта, но правило "all" берёт и её, и все прочие.
  PRIORITY_ACTORS:
    - "7p4AkPb9AQHhzmUHF2kUaHdXp2xizrUnmn7vQw9D4GXD"
    - "XyPCF8DaiTFugUxasuWQsQi3y1nkPrDtTLfkzKshn2U"

# --- ВЫХОД: частичные тейки + защита остатка ---------------------------------
# Тактика H (аудит-3): самая робастная из 11 сравненных — обе половины time-split >0,
# минимальная дисперсия (σ=1.1), лучшая стойкость к exit-хайркату.
exit:
  # ОТКЛЮЧЁН 07.08 по замеру на 5533 реальных сделках. Было [[2.0, 0.5]].
  # A/B: без тейка +8637$ против +7638$ с тейком = +999$, лучше во ВСЕХ четырёх
  # отрезках периода (+241 +201 +308 +250) и по метрике без топ-3 (+928$).
  # Цены касались 2x лишь в 7.6% сделок, и на них тейк срезал прибыль, не защищая
  # от падения: худшая сделка одинакова (−106%) с ним и без него.
  # Отдельно: он и так почти не срабатывал — медиана удержания 24с при тике 15с.
  PARTIAL_TAKES: []            # [[множитель, доля]] — пусто = позиция не дробится
  TP_MULT: 6.0                 # финальный тейк остатка
  # ОТКЛЮЧЁН 07.08 (0 = стоп не срабатывает). Было 0.5.
  # A/B на реальных сделках: без стопа +8545$ против +7873$ = +672$, лучше во всех
  # четырёх отрезках (+287 +202 +176 +7) и по метрике без топ-3 (+8128$ / +7456$).
  # РЕШАЮЩЕЕ: стоп НЕ уменьшал ни худшую сделку (−106% с ним и без него), ни
  # просадку ($41 в обоих случаях). Трекер смотрит цену раз в 15с, а тонкая книга
  # мем-токена проскакивает уровень между тиками — стоп срабатывал уже ниже, чем
  # стоял. При этом в 38% случаев цена потом возвращалась выше входа.
  # Позицию закрывают: продажа актора 78.6%, мёртвый токен 5.0%, трейлинг 4.9%,
  # таймаут 30 мин, тейк 6x. Убыток по позиции ограничен клипом ($10.60 в худшем).
  SL_MULT: 0.0                 # 0 = стоп отключён
  TRAIL: 0.35                  # трейлинг остатка: падение от пика
  TRAIL_ARM: 1.5               # трейлинг взводится после роста >= этого × entry
  # ВНИМАНИЕ: при MAX_HOLD_S=300 это правило НЕДОСТИЖИМО — таймаут проверяется
  # раньше и закрывает позицию через 5 минут, а не через час. Оставлено осознанно
  # на случай возврата длинного таймаута; тест это соотношение фиксирует.
  DEAD_AGE_H: 1.0              # нет данных дольше → мёртвый (сейчас перекрыт таймаутом)
  # СОКРАЩЁН 08.08 с 1800 (30 мин). Замер на 7225 позициях за 26.7 суток, симулятор
  # сверен с фактом (совпадение причин 99%, PnL завышен на 39% — дельты считать
  # верхней границей):
  #   30 мин (было): +281$/сут · без-топ3 +5605$ · win 0.36 · медиана −13.6%
  #   10 мин:        +323$/сут · без-топ3 +6732$
  #    5 мин:        +367$/сут · без-топ3 +7900$ · win 0.40 · медиана −9.5%
  #    3 мин:        +364$/сут — дальше сокращать нечего
  # УСТОЙЧИВОСТЬ по 5 отрезкам, все положительны. Решающее: во ВТОРОМ отрезке
  # (плохой рынок) было +140$, стало +1402$ — вдесятеро. Длинный таймаут не
  # защищал, он давал застрявшим позициям догнивать: 83% таймаутов имели пик ниже
  # 1.5x, то есть трейлинг им недоступен, а стопа больше нет.
  # ЦЕНА: режется часть будущих победителей (лучший случай +827% → −21%). Но топ-3
  # сделок дают одинаковый вклад в обоих вариантах — крупнейшие выживают.
  # Медиана удержания 24с, p90 5.1 мин: 90% сделок правка не касается вовсе.
  MAX_HOLD_S: 300              # max-hold таймаут, 5 минут
  # ИЗМЕНЕНО 08.08 с 0.5. Формула: нужно продаж = max(1, ceil(FRAC × вошло_акторов)).
  #   было 0.5 → при 3 акторах ждали 2 продажи, при 5 — три
  #   стало 0.25 → одной продажи достаточно при любом числе до 4 включительно
  # Мы следуем за акторами на входе; логично следовать и на выходе. Ожидание второго
  # продавца оплачивалось из кармана: позиции «вышел 1 из 3» имеют медиану −40.2%,
  # потому что доезжают до таймаута.
  # A/B по позициям, где порога не хватило: за весь период 457 штук, −147$ как есть
  # против +425$ при выходе на первой продаже (+27$/сут); после отключения стопа
  # 38 штук, −39$ против +46$ (+22$/сут). Таймаутов на новом периоде: 31 → 8.
  # Цена выросла вчетверо после отключения стопа: раньше такие позиции закрывались
  # стопом на −50% и не доезжали до таймаута — стоп маскировал проблему.
  # ДВЕ МОИ ПРЕЖНИЕ ОЦЕНКИ ЭТОЙ ПРАВКИ БЫЛИ НЕВЕРНЫ: «+112$» меряла двухакторные
  # сигналы, где правило и так выходит первым; «+19$» выбрасывала из выборки токены
  # без нужного числа продаж, то есть худшие случаи высокого порога.
  EXIT_ACTOR_FRAC: 0.25        # вышло >= доли зашедших акторов → выход

# --- РИСК / КАПИТАЛ ----------------------------------------------------------
risk:
  MAX_POSITIONS: 5    # капитал-replay: 5 слотов = edge без потерь, 3 = 18/19 хвостов
  # ИЗМЕРЕНО НА ЖИВЫХ ДЕНЬГАХ 10.08 и поднято с 0.06. Прежнее значение приходило из
  # shadow-замера (медиана 3.3%, p90 4.2%) — а shadow мерил только фрикцию КОТИРОВКИ.
  # Разложение 179 живых сделок по дельтам самих транзакций:
  #     вход: купили дороже модели   медиана −5.66%  среднее −6.38%
  #     выход: продали дешевле       медиана −3.50%  среднее −5.47%
  #     комиссии сети                медиана −0.24%  среднее −0.30%
  #     сумма слагаемых              12.15%
  #     полный разрыв доходностей    медиана −10.76% среднее −16.89%
  # БЕРЁМ 12%, А НЕ 17%. Слагаемые входят МУЛЬТИПЛИКАТИВНО, а разрыв считается как
  # разница доходностей, поэтому на хвостовом победителе те же проценты дают куда
  # больший абсолютный разрыв — отсюда среднее 16.89%. Вычитать 17% из КАЖДОЙ сделки
  # означало бы наказывать типичную сделку за чужой хвост.
  # Цена этого выбора: суммарные оценки останутся слегка оптимистичными, потому что
  # на победителях фрикция съедает больше. Честнее было бы применять её множителем,
  # но EXIT_FEE вычитается по всему коду — менять это отдельной правкой.
  # ПОЧЕМУ ТАК МНОГО. Модель записывает вход по цене, которую получил АКТОР, за которым
  # мы идём. Эта цена нам недоступна по определению: мы узнаём о его покупке после неё
  # и входим по тому, что он нам оставил. На выходе зеркально. 62% разрыва даёт вход.
  # ПРОВИЗОРНО: замер сделан за смену, в которую входили и мои собственные дефекты
  # (сорванная продажа ждала 259с до таймаута — починено в конце дня). Пересчитать
  # через сутки чистой работы; ожидаю, что выходная часть уменьшится.
  EXIT_FEE: 0.12      # полная цена круга: вход + выход + комиссии (замер 10.08)
  # Порог смерти edge: реальный хайркат > ~12% → стратегия убыточна (аудит-3).
  # ИЗМЕРЕННЫЕ 12.15% СТОЯТ РОВНО НА НЁМ. Это не повод двигать порог — это результат.

  # --- Фаза C: капитал и предохранители (перекалибровано 05.08 на 8 днях данных) ---
  # ПРИВЯЗАН 10.08 к ФАКТИЧЕСКОМУ остатку кошелька: 5.2094 SOL × $76.85 = $400.
  # Смысл: дневной стоп считается от этого числа, и пока оно было взято с потолка,
  # стоп на −$100 мог составлять половину реальных денег — то есть не срабатывать.
  # Теперь стоп = 25% × 400 = $100 от того, что действительно лежит на кошельке.
  # ПРИ ИЗМЕНЕНИИ ОСТАТКА обновлять вместе с SWEEP_TRIGGER_USD (валидация их связывает).
  BANKROLL_USD: 400     # 40 клипов. MC risk-of-ruin при клипе $10:
  CLIP_USD: 10          # ЗАМЕРЕНО: фрикция $10=3.07% < $20=3.69% < $50=5.70% < $100=7.86%.
                        # Клип $100 подходит к порогу смерти 12% → размер позиции ограничен сверху.
  DAILY_STOP_FRAC: 0.25 # БЫЛО 0.10 — вредило: срабатывало в 4 днях из 8, и ВСЕ 4 закрылись в плюсе
                        # (стоп резал хвостовую стратегию до прихода выигрыша, цена $2101 из $5823).
                        # Калибровка: худшая просадка внутри дня = 17% банка → 25% даёт запас 1.5x
                        # и не срабатывает ни разу на 8 днях. Это защита от КАТАСТРОФЫ, не регулятор
                        # обычной волатильности. Инвариант к размеру клипа (при том же числе клипов).
  MAX_LOSS_STREAK: 20   # аварийный выключатель СТРУКТУРНОЙ поломки. Порог высокий намеренно:
                        # у стратегии ~57% убыточных сделок, серии — норма (MC: до 30 подряд)
  KILL_FILE: "KILL"     # `touch output/KILL` на VPS → мгновенная остановка входов без деплоя
  # ВОЗВРАЩЁН в shadow 10.08 вместе с остановкой живых денег.
  RISK_MODE: "shadow"   # shadow = денежные лимиты ЛОГИРУЮТСЯ (paper копит данные);
                        # enforce = блокируют (переключить ПЕРЕД реальными деньгами).
                        # KILL-switch и лимит позиций жёсткие в любом режиме.

# --- АЛЕРТЫ / КАЧЕСТВО ДАННЫХ ------------------------------------------------
alerts:
  # МАРКЕР качества входа (НЕ гейт): на live-исходах давал win 58%/mean +43%, НО на
  # траекториях затухает (1пол +43.7% → 2пол +7.8%) → под вопросом, не ужесточать вход.
  QUALITY_MIN_MC: 15000
  QUALITY_MIN_VELOCITY: 40
  SANITY_JUMP: 50.0        # скачок цены между тиками больше этого = мусор источника (аудит-4)
  STALE_SIGNAL_H: 6        # нет ни одного сигнала дольше — алерт «поток иссяк»
  # ПОДНЯТ 10.08 с 20. Порог 20 был назначен до правки о выпуске токенов на DEX и с тех
  # пор превышался КАЖДЫМ пульсом — алерт «источник врёт?» уходил всегда и перестал что-либо
  # значить. Замер 10.08: за шестичасовой пульс 127 аномалий; в десятичасовом окне логов
  # 125 на разборе сделки (пылевые продажи, аудит-5), 46 на запасной котировке (миграция
  # пула, правка 08.08), 0 у трекера. Это НОРМА работающего фильтра, а не поломка.
  # 400 = примерно трёхкратный запас к наблюдаемому уровню ~130 за пульс.
  # ОСНОВАНИЕ СЛАБОЕ: два замера за одни сутки. Пересчитать, когда накопится неделя пульсов.
  # В сообщение добавлена разбивка по источнику: скачок именно на разборе сделки означал бы
  # поломку парсера логов, а на запасной котировке — проблему у Jupiter.
  MAX_ANOMALY_RATE: 400    # аномалий цены за период heartbeat больше — алерт
  # Приоритетный актор — единая точка отказа: если он уйдёт (а 26 из 68 акторов уже молчат),
  # мы потеряем лучшую когорту (медиана +68%) и не заметим этого.
  PRIORITY_SILENCE_H: 48   # приоритетный актор молчит дольше — АЛЕРТ
  WATCHLIST_MAX_AGE_D: 7   # список старше — напоминание перезапустить discovery

# --- ИСПОЛНЕНИЕ (Фаза B: SHADOW — только котировки, ничего не отправляется) ---
execution:
  SHADOW_CLIP_USD: 10     # == CLIP_USD: меряем фрикцию на РЕАЛЬНОМ размере сделки
  # РАЗДЕЛЁН НА ВХОД И ВЫХОД 10.08, по первым 43 живым сделкам.
  # Замер: 9 отказов из 43 = 21%, ВСЕ с одной ошибкой Jupiter Custom 6001
  # (SlippageToleranceExceeded). По сторонам: покупки 6/24 = 25%, продажи 3/19 = 16%.
  # Проскальзывание на ПРОШЕДШИХ сделках: медиана 0.67%, p90 3.03% — то есть допуск
  # стоял ровно на краю распределения и срезал весь хвост. Сами замеры при этом
  # цензурированы: всё, что вышло за 3%, до леджера не дошло.
  # АСИММЕТРИЯ. Допуск — это ПОТОЛОК, а не издержка: платим фактическое
  # проскальзывание, а не порог. Поэтому вопрос только один — что лучше при плохой цене.
  #   сорванная ПОКУПКА стоит комиссию (~$0.01–0.03) и пропущенную сделку. Дёшево.
  #   сорванная ПРОДАЖА оставляет позицию открытой, пока токен льют: актор уже вышел,
  #   а мы ждём следующей попытки. Здесь плохая цена лучше отсутствия цены.
  # Поэтому вход оставляем тугим, выход отпускаем. 10% выбраны, чтобы УВИДЕТЬ
  # распределение за 3%, которое сейчас цензурировано нами же; после суток данных
  # подобрать по факту.
  # ВОЗВРАЩЁН К 300 (10.08, через 3 часа после подъёма до 1000). Замер показал, что
  # поднятие НИЧЕГО не дало:
  #     допуск 3%:  20 попыток продажи, отказов 3 = 15%
  #     допуск 10%: 47 попыток продажи, отказов 8 = 17%
  # Качество исполнения тоже не изменилось: медиана проскальзывания прошедших продаж
  # −0.12% против −0.08%. Значит отказы происходят НЕ из-за тесного порога, а держать
  # порог широким — отдавать опцион даром.
  # И ГЛАВНОЕ, что выяснилось при этом замере: сорванные ПОКУПКИ спасают деньги.
  # 30 пропущенных входов, восстановленных по журналу цен: медиана исхода через 5 минут
  # −37.4%, в плюсе только 8 из 30. Если бы все прошли, это −$73 (−$109 с учётом
  # реального исполнения). Отказ срабатывает ровно тогда, когда цену уводят против нас,
  # то есть работает как фильтр, а не как помеха.
  SLIPPAGE_BPS: 300       # допуск на ВХОДЕ (3%)
  SLIPPAGE_BPS_SELL: 300  # допуск на ВЫХОДЕ (3%) — поднятие до 10% пользы не дало
  SHADOW_ENABLED: true    # мерить фрикцию на входе/выходе каждой paper-позиции

  # --- Фаза D часть 2: РЕАЛЬНОЕ ИСПОЛНЕНИЕ (тратит настоящие деньги) ---
  # ОСТАНОВЛЕНО 10.08 в 20:25 UTC по решению владельца, после 11 часов живой торговли.
  # ИТОГ: кошелёк 5.2094 -> 3.9888 SOL, то есть −1.22 SOL ≈ −$93 на ~190 сделках.
  # ПРИЧИНА, ИЗМЕРЕННАЯ НА 179 СДЕЛКАХ ПО ДЕЛЬТАМ ТРАНЗАКЦИЙ:
  #     вход: купили дороже модели   среднее −6.38%   (62% разрыва)
  #     выход: продали дешевле       среднее −5.47%   (38%)
  #     комиссии сети                среднее −0.30%
  #     цена круга                            12.15%
  # Порог смерти edge из аудита-3 — 12%. Мы стоим ровно на нём, а бумажная медиана
  # сделки была около нуля. Ноль минус двенадцать процентов и дал −$16 в час.
  # СТРУКТУРНАЯ, А НЕ НАСТРОЕЧНАЯ ПРИЧИНА: модель записывала вход по цене, которую
  # получил АКТОР, за которым мы идём. Эта цена нам недоступна — мы узнаём о его
  # покупке ПОСЛЕ неё и входим по тому, что он оставил. На выходе зеркально.
  # ЧТО ПРОВЕРЕНО И НЕ ПОМОГЛО: порог по влиянию на цену (корреляция с входным
  # разрывом −0.047), расширение допуска проскальзывания (отказов 15% против 17%).
  # ЧТО ПОМОГЛО, НО МАЛО: повтор сорванной продажи на ближайшем тике (+$17 на 45
  # цепочках) — он бьёт по выходной части, а она лишь 38% разрыва.
  # ВКЛЮЧАТЬ ОБРАТНО только после того, как найден способ платить за вход меньше.
  LIVE_ENABLED: false
  # Узел для ОТПРАВКИ сделок, отдельно от чтения. Публичный узел лимитирует
  # sendTransaction и может молча не разослать транзакцию — читать с него можно,
  # тратить деньги нельзя. Живой режим с SEND_PROVIDER=public запрещён проверкой.
  # Замер 07.08 с сервера (Франкфурт), отклик на sendTransaction:
  #   jito 0.04с · public 0.08с · publicnode 0.17с · tatum 0.24с
  #   drpc — Solana НЕ входит в бесплатный тариф (Growth от $6 за 1M запросов)
  #   jito — требует чаевые от 1000 лампортов, которых нет в транзакции Jupiter
  #   helius — заблокирован до 01.09
  # Нагрузка: 310 транзакций в сутки, пик 2 в секунду — влезает в любой бесплатный тариф.
  SEND_PROVIDER: publicnode   # helius | drpc | jito | publicnode | public        # false = только план, ничего не отправляется. Включать ПОСЛЕДНИМ
  MAX_SWAP_USD: 25           # жёсткий потолок на один своп (клип $10 + запас). Даже если
                             # позовут с мусорной суммой — больше этого не купим никогда
  MAX_PRIORITY_LAMPORTS: 1000000   # потолок приоритетной комиссии (~$0.07) на транзакцию
  PRIORITY_LEVEL: "high"     # уровень приоритета Jupiter: medium|high|veryHigh
  CONFIRM_TIMEOUT_S: 60      # нет подтверждения за это время = НЕУДАЧА (fail closed)

# --- ВЫВОД ПРИБЫЛИ на холодный кошелёк (Фаза D) ------------------------------
# Адрес ЗДЕСЬ, а не в .env: конфиг под git → подмена получателя видна в диффе.
# Функция вывода НЕ принимает адрес параметром — отправить куда-то ещё технически нельзя.
# ЧЕСТНО: от кражи ключа это не защищает (на Solana нет биржи-арбитра) — защищает малый
# остаток на горячем кошельке, ради чего и выводим часто.
sweep:
  ENABLED: false          # включить ПОСЛЕ настройки адреса и проверки dry-run
  DRY_RUN: true           # true = только считать и логировать, НЕ отправлять
  SWEEP_ADDRESS: "DPNzEzivmspJC6u9ZkSRQKCugQLxoLtTJchxZVSuwThV"   # Ledger владельца.
                          # Проверено: валидный, 32 байта, на кривой ed25519, != горячего.
                          # ЗДЕСЬ (под git), а не в .env: подмена видна в диффе как правка кода
  SWEEP_TRIGGER_USD: 430  # = банк $400 + шаг $25 + буфер ~$4. ВАЖНО: при пороге $500 каждый
                          # вывод был бы ~$100, и шаг $25 не применялся бы вовсе — экономика,
                          # которую считали, не работала бы. Порог и шаг должны быть согласованы.
  SWEEP_MIN_USD: 25       # шаг вывода. Комиссия $0.00037 несущественна при любом шаге
                          # (при $25 = 0.0015% прибыли) → выбор диктует безопасность:
                          # средний излишек под ударом всего $12 вместо $50 при шаге $100
  SWEEP_MAX_USD: 2000     # потолок на одну транзакцию (санитарный ограничитель)
  MIN_INTERVAL_S: 60      # защита от цикла, выжигающего комиссии
  FEE_BUFFER_SOL: 0.05    # неснижаемый остаток на комиссии (~$4)

# --- ТРЕКИНГ ЦЕН -------------------------------------------------------------
tracking:
  # Инцидент 06.08: 5 WS-соединений с ретраем раз в минуту дали 242 попытки/час →
  # Helius ответил HTTP 429 и заблокировал ДАЖЕ одиночное подключение (на уровне аккаунта).
  # Меньше каналов = меньше попыток переподключения и меньше риск повторить.
  WS_CONNECTIONS: 4   # 148 подписок / 4 = 37 на канал (публичный узел рвёт связь после ~50)
  # Лимит Helius исчерпан до 01.09 (сожжён за 4 дня вызовами getTransaction).
  # Публичный узел Solana квоты не имеет; после разбора сделок из логов дорогие
  # вызовы почти не нужны, поэтому работаем на нём. Вернуть "helius" после сброса.
  RPC_PROVIDER: public   # helius | public
  MAX_SUBS_PER_CONN: 50  # измерено 06.08: 50 подписок принимаются, 148 залпом — нет
  # Замер 06.08: эти два адреса дают 11.9 млн событий/сутки (10.9 ГБ) — 99.9% трафика,
  # почти всё спам программы BevFQ2LKT (MEV). Отписаться нельзя: они участвуют в 448
  # прибыльных сигналах, win 0.48 против 0.29 у остальных. Держим их на ОТДЕЛЬНОМ канале,
  # чтобы троттлинг публичного узла не гасил остальные 146 кошельков (те дают 65 МБ/сутки
  # и первыми подают 99.8% сигналов).
  HIGH_RATE_WALLETS:
    - VJSDW6S74YXR4rRR9P4xwhMvLZJQMhrUb8XMFirUsy1
    - GijFWw4oNyh9ko3FaZforNsi3jk6wDovARpkKahPD4o5
  TICK_S: 15      # период поллинга (== гранулярность выходов; на 90с edge исчезал!)
  TRACK_S: 2700   # сколько вести токен после сигнала (45 мин)
